name: Export Secrets to Env

on: [push]

jobs:
  create-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make envfile
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          printf 'GEMINI_MODEL_ID=%s\n' "$GEMINI_MODEL_ID" >> .env
          printf 'FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY" >> .env
          printf 'FIREBASE_APP_ID=%s\n' "$FIREBASE_APP_ID" >> .env
          printf 'FIREBASE_MESSAGING_SENDER_ID=%s\n' "$FIREBASE_MESSAGING_SENDER_ID" >> .env
          printf 'FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID" >> .env
          printf 'FIREBASE_AUTH_DOMAIN=%s\n' "$FIREBASE_AUTH_DOMAIN" >> .env
          printf 'FIREBASE_STORAGE_BUCKET=%s\n' "$FIREBASE_STORAGE_BUCKET" >> .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_ID: ${{ secrets.GEMINI_MODEL_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Upload .env as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: .env